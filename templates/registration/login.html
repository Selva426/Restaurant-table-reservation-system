{% extends 'base.html' %}
{% block title %}Login | Table &amp; Thyme{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto p-4">
  <h2 class="mb-3">Welcome back</h2>
  <p class="text-muted">Sign in to manage your table reservations.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 mb-0">New customer? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
