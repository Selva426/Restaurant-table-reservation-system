{% extends 'base.html' %}
{% block title %}Delete Reservation{% endblock %}
{% block content %}
<div class="card p-4 mx-auto form-card">
<h1 class="h3">Delete reservation?</h1>
<p>Are you sure you want to delete the reservation for <strong>{{ reservation.customer_name }}</strong> on {{ reservation.reservation_date }}?</p>
<form method="post">{% csrf_token %}<button class="btn btn-danger">Yes, delete</button> <a class="btn btn-outline-secondary" href="{% url 'reservation_list' %}">Cancel</a></form>
</div>
{% endblock %}
